name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: python --version

      - name: Compile Python files
        run: python -m py_compile server.py xy_auto.py tests/test_phase1.py tests/test_server_flow.py

      - name: Validate question bank
        run: python -c "import json; from pathlib import Path; data=json.loads(Path('xy_bank.json').read_text(encoding='utf-8')); assert isinstance(data, dict) and data"

      - name: Run tests
        run: python -m unittest tests.test_phase1 tests.test_server_flow -v

      - name: Check shell installer
        if: runner.os == 'Linux'
        run: bash -n install.sh
