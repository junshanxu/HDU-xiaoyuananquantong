<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园安全通 一键答题</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
.container { max-width: 760px; margin: 0 auto; }
h1 { text-align: center; margin: 16px 0 24px; color: #1a7f37; font-size: 22px; }
.card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.card > label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 600; }
input[type=text], input[type=number] { width: 100%; padding: 9px 11px; border: 1px solid #d0d5dd; border-radius: 7px; font-size: 14px; font-family: inherit; }
input:focus { outline: none; border-color: #1a7f37; }
.row { display: flex; gap: 10px; align-items: center; }
.row input { flex: 1; }
.btn { padding: 9px 18px; border: none; border-radius: 7px; font-size: 14px; cursor: pointer; background: #1a7f37; color: #fff; font-family: inherit; }
.btn:hover { background: #156533; }
.btn:disabled { background: #ccc; cursor: not-allowed; }
.btn.gray { background: #e5e7eb; color: #333; }
.btn.gray:hover { background: #d1d5db; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.mode { padding: 12px; border: 1px solid #d0d5dd; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; background: #fff; user-select: none; }
.mode small { display: block; font-size: 11px; color: #888; margin-top: 2px; font-weight: 400; }
.mode.active { border-color: #1a7f37; background: #e8f5ee; color: #1a7f37; font-weight: 600; }
.mode.active small { color: #1a7f37; }
.opts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; align-items: center; }
.opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.opts input[type=number] { width: 60px; padding: 5px 8px; }
.actions { display: flex; gap: 10px; margin-bottom: 14px; }
.actions .btn { flex: 1; padding: 12px; font-size: 15px; }
#log { background: #1e1e1e; color: #d4d4d4; padding: 14px; border-radius: 8px; font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 12.5px; line-height: 1.6; height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.log-line { margin: 0; }
.log-pass { color: #4ade80; }
.log-fail { color: #f87171; }
.log-warn { color: #fbbf24; }
.log-info { color: #60a5fa; }
.tip { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.5; }
.empty { color: #666; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ 校园安全通 一键答题</h1>

  <div class="card">
    <label>① 粘贴平台链接（compulsory / simulate / test 任一页面）</label>
    <div class="row">
      <input type="text" id="url" placeholder="http://wap.xiaoyuananquantong.com/guns-vip-main/wap/compulsory?courseType=1&userId=...&collegeId=...&ah=...">
      <button class="btn gray" onclick="parseUrl()">解析</button>
    </div>
    <div class="tip">登录 wap.xiaoyuananquantong.com → 从浏览器地址栏复制任一页面链接 → 粘贴后点「解析」。</div>
  </div>

  <div class="card">
    <label>② 参数（解析后自动填充，可手动修改）</label>
    <div class="row" style="margin-bottom:8px"><input type="text" id="userId" placeholder="userId"></div>
    <div class="row" style="margin-bottom:8px"><input type="text" id="collegeId" placeholder="collegeId"></div>
    <div class="row"><input type="text" id="ah" placeholder="ah"></div>
  </div>

  <div class="card">
    <label>③ 选择模式</label>
    <div class="modes">
      <div class="mode active" data-mode="chapter" onclick="selectMode(this)">章节测试<small>必修课答题</small></div>
      <div class="mode" data-mode="learn_all" onclick="selectMode(this)">刷题库<small>模拟考全错学习</small></div>
      <div class="mode" data-mode="exam_mock" onclick="selectMode(this)">模拟考试<small>无限次</small></div>
      <div class="mode" data-mode="exam_official" onclick="selectMode(this)">正式考试<small>限次</small></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="force"> 重做已完成</label>
      <label><input type="checkbox" id="retryExam"> 正式考自动重考</label>
      <label>最大重试 <input type="number" id="maxRetry" value="10"></label>
    </div>
    <div class="tip">建议流程：章节测试 → 刷题库(学到满) → 模拟考验证 → 正式考试。</div>
  </div>

  <div class="actions">
    <button class="btn" id="startBtn" onclick="start()">开始答题</button>
    <button class="btn gray" id="stopBtn" onclick="stop()" disabled>停止</button>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <pre id="log"><span class="empty">等待开始...</span></pre>
  </div>
</div>

<script>
let mode = "chapter", es = null, taskId = null;

function selectMode(el){
  document.querySelectorAll(".mode").forEach(e => e.classList.remove("active"));
  el.classList.add("active");
  mode = el.dataset.mode;
}

async function parseUrl(){
  const url = document.getElementById("url").value.trim();
  if(!url){ alert("请粘贴链接"); return; }
  try {
    const r = await fetch("/api/parse", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
    const d = await r.json();
    if(d.error){ alert(d.error); return; }
    document.getElementById("userId").value = d.userId || "";
    document.getElementById("collegeId").value = d.collegeId || "";
    document.getElementById("ah").value = d.ah || "";
    log("✓ 已解析参数", "info");
  } catch(e){ alert("解析失败: " + e); }
}

function log(msg, type){
  const el = document.getElementById("log");
  const empty = el.querySelector(".empty");
  if(empty) el.textContent = "";
  const div = document.createElement("div");
  div.className = "log-line " + (type||"");
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function start(){
  const body = {
    userId: document.getElementById("userId").value.trim(),
    collegeId: document.getElementById("collegeId").value.trim(),
    ah: document.getElementById("ah").value.trim(),
    mode,
    force: document.getElementById("force").checked,
    retryExam: document.getElementById("retryExam").checked,
    maxRetry: +document.getElementById("maxRetry").value || 10,
  };
  if(!body.ah || !body.userId || !body.collegeId){
    alert("参数不全：请先粘贴链接点「解析」，或手动填写 userId / collegeId / ah");
    return;
  }
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
  document.getElementById("log").textContent = "";
  log("▶ 启动 " + modeName(mode) + " ...", "info");

  try {
    const r = await fetch("/api/start", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    const d = await r.json();
    if(d.error){ alert(d.error); resetBtns(); return; }
    taskId = d.taskId;
    es = new EventSource("/api/stream/" + taskId);
    es.onmessage = (e) => {
      const m = e.data;
      let t = "";
      if(m.includes("✓") || m.includes("通过！") || m.includes("通过 ") && !m.includes("未通过")) t = "pass";
      else if(m.includes("×") || m.includes("未通过") || m.includes("失败")) t = "fail";
      else if(m.includes("[!]") || m.includes("[错误]") || m.includes("警告")) t = "warn";
      log(m, t);
    };
    es.addEventListener("done", (e) => {
      const ok = e.data === "done";
      log("\n════════════════════════", "");
      log(ok ? "✅ 任务完成" : (e.data === "error" ? "❌ 任务出错" : "⏹ 已停止"), ok ? "pass" : "warn");
      es.close(); es = null;
      resetBtns();
    });
    es.onerror = () => { es.close(); es = null; resetBtns(); log("连接中断", "warn"); };
  } catch(e){ alert("启动失败: " + e); resetBtns(); }
}

function resetBtns(){
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
}

async function stop(){
  if(!taskId) return;
  await fetch("/api/stop/" + taskId, {method:"POST"});
  log("已请求停止...", "warn");
}

function modeName(m){
  return {chapter:"章节测试", learn_all:"刷题库", exam_mock:"模拟考试", exam_official:"正式考试"}[m] || m;
}
</script>
</body>
</html>
