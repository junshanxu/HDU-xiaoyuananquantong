<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>安全教育答题工具</title>
<style>
:root {
  --paper: #eef0f3;
  --surface: #f8fafc;
  --ink: #344054;
  --muted: #667085;
  --line: #d0d5dd;
  --line-strong: #98a2b3;
  --accent: #475467;
  --accent-soft: #eaecf0;
  --green: #157347;
  --green-soft: #e8f3ed;
  --terminal: #f1f3f5;
  --terminal-line: #d7dce2;
}

* { box-sizing: border-box; }

html { min-width: 320px; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

button:focus-visible, input:focus-visible {
  outline: 3px solid rgba(71, 84, 103, .22);
  outline-offset: 2px;
}

.page {
  width: min(1180px, calc(100% - 40px));
  margin: 0 auto;
  padding: 28px 0 52px;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr);
  gap: 20px;
  margin-top: 0;
  align-items: stretch;
}

.sheet, .console {
  border: 1px solid var(--line-strong);
  background: var(--surface);
}

.sheet { align-self: start; }

.section {
  padding: 24px;
  border-bottom: 1px solid var(--line);
}

.section:last-child { border-bottom: 0; }

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 16px;
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 0;
  font-size: 16px;
  font-weight: 750;
}

.section-no {
  color: var(--accent);
  font: 700 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
}

.url-row {
  display: block;
}

.text-input {
  width: 100%;
  min-width: 0;
  height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  background: #fff;
  color: var(--ink);
  font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
}

.text-input::placeholder { color: #99978e; }

.text-input[readonly] {
  border-color: var(--line);
  background: #eaecf0;
  color: #667085;
  cursor: default;
}

.url-hint {
  display: flex;
  justify-content: flex-end;
  gap: 14px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.auto-label {
  flex: none;
  color: var(--green);
  font: 700 11px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
  letter-spacing: .04em;
}

.btn {
  min-height: 42px;
  padding: 0 18px;
  border: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.btn:hover { background: #eaecf0; }
.btn:disabled { cursor: not-allowed; opacity: .42; }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover { background: #344054; }

.btn-stop:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.params {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font: 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
}

.field .text-input {
  height: 40px;
  padding: 0 10px;
  font-size: 12px;
  border-color: var(--line);
}

.actions {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

.actions .btn { min-height: 50px; }

.notice {
  display: none;
  margin-top: 12px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  color: #75301f;
  font-size: 12px;
  line-height: 1.5;
}

.notice.show { display: block; }
.notice.ok { border-color: var(--green); background: var(--green-soft); color: #174e35; }

.certificate-result {
  display: none;
  margin-top: 12px;
  padding: 14px 12px;
  border-left: 3px solid var(--green);
  background: var(--green-soft);
  color: #174e35;
}

.certificate-result.show { display: block; }

.certificate-result strong {
  display: block;
  font-size: 13px;
}

.certificate-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.certificate-actions .btn {
  display: inline-flex;
  min-height: 36px;
  align-items: center;
  text-decoration: none;
}

.certificate-actions [hidden] { display: none; }

.certificate-preview {
  display: block;
  width: 100%;
  max-height: 260px;
  margin-top: 12px;
  object-fit: contain;
  object-position: left top;
  border: 1px solid rgba(23, 107, 67, .3);
  background: #fff;
}

.exception-result {
  display: none;
  margin-top: 12px;
  padding: 14px 12px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  color: #75301f;
}

.exception-result.show { display: block; }
.exception-result strong { display: block; font-size: 13px; }
.exception-result p { margin: 6px 0 0; font-size: 12px; line-height: 1.55; }

.console {
  display: flex;
  min-height: 660px;
  flex-direction: column;
  background: var(--terminal);
  color: var(--ink);
}

.console-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 54px;
  padding: 0 18px;
  border-bottom: 1px solid var(--terminal-line);
  font: 11px/1 ui-monospace, "SFMono-Regular", Menlo, monospace;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.console-title { color: var(--muted); }

.task-state {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}

.state-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #98a2b3;
}

.task-state.running .state-dot {
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(71, 84, 103, .12);
  animation: pulse 1.4s ease-in-out infinite;
}

.task-state.done .state-dot { background: #12b76a; }
.task-state.failed .state-dot { background: #f04438; }

@keyframes pulse { 50% { opacity: .45; } }

#log {
  flex: 1;
  min-height: 0;
  max-height: 700px;
  overflow-y: auto;
  padding: 20px 18px 30px;
  font: 12px/1.75 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.empty { color: #98a2b3; }
.empty::before { content: "> "; color: var(--accent); }
.log-line::before { content: "· "; color: #98a2b3; }
.log-pass { color: var(--green); }
.log-fail { color: #b42318; }
.log-warn { color: #9a6700; }
.log-info { color: var(--ink); }

.console-foot {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 18px;
  border-top: 1px solid var(--terminal-line);
  color: #98a2b3;
  font: 10px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
}

@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; }
  .console { min-height: 480px; }
}

@media (max-width: 620px) {
  .page { width: min(100% - 24px, 1180px); padding-top: 22px; }
  .section { padding: 18px; }
  .section-head { display: block; }
  .params { grid-template-columns: 1fr; }
  .url-row, .actions { grid-template-columns: 1fr; }
  .url-row .btn { min-height: 42px; }
  .url-hint { display: block; }
  .auto-label { display: block; margin-top: 6px; }
  .console-foot { display: block; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="page">
  <div class="workspace">
    <section class="sheet" aria-label="答题设置">
      <div class="section">
        <div class="section-head">
          <h2 class="section-title"><span class="section-no">01</span>粘贴平台链接</h2>
        </div>
        <div class="url-row">
          <input class="text-input" type="text" id="url" autocomplete="off" spellcheck="false" aria-label="平台链接" placeholder="粘贴从杭电保卫公众号复制的完整链接" />
        </div>
        <div class="url-hint">
          <span class="auto-label">粘贴后自动开始</span>
        </div>

        <div class="params" aria-label="解析参数">
          <div class="field">
            <label for="userId">USER ID</label>
            <input class="text-input" type="text" id="userId" autocomplete="off" placeholder="等待解析" readonly aria-readonly="true" />
          </div>
          <div class="field">
            <label for="collegeId">COLLEGE ID · HDU</label>
            <input class="text-input" type="text" id="collegeId" autocomplete="off" value="1940953111032012801" readonly aria-readonly="true" />
          </div>
          <div class="field">
            <label for="ah">SESSION TOKEN</label>
            <input class="text-input" type="password" id="ah" autocomplete="off" placeholder="等待解析" readonly aria-readonly="true" />
          </div>
        </div>
      </div>

      <div class="section">
        <div class="actions">
          <button type="button" class="btn btn-primary" id="startBtn" onclick="start()">开始答题并获取证书</button>
          <button type="button" class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>停止任务</button>
        </div>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>
        <div class="certificate-result" id="certificateResult" role="status" aria-live="polite">
          <strong>已获得证书</strong>
          <img class="certificate-preview" id="certificateImage" alt="安全教育合格证书预览" hidden />
          <div class="certificate-actions">
            <a class="btn btn-primary" id="saveCertificate" href="#" download="杭电安全教育合格证书.jpg" onclick="markCertificateSaved()" hidden>保存证书图片</a>
            <a class="btn" id="openCertificate" href="#" target="_blank" rel="noopener noreferrer" hidden>打开证书页</a>
            <button type="button" class="btn" id="copyCertificate" onclick="copyCertificateLink()" hidden>复制证书链接</button>
          </div>
        </div>
        <div class="exception-result" id="exceptionResult" role="alert" aria-live="assertive">
          <strong id="exceptionTitle"></strong>
          <p id="exceptionMessage"></p>
        </div>
      </div>
    </section>

    <aside class="console" aria-label="运行记录">
      <div class="console-head">
        <span class="console-title">运行记录</span>
        <span class="task-state" id="taskState"><span class="state-dot"></span><span id="stateText">等待</span></span>
      </div>
      <div id="log" aria-live="polite"><span class="empty">等待链接或手动启动</span></div>
      <div class="console-foot"><span>本地进程 · 实时输出</span><span>CTRL+C 可停止服务</span></div>
    </aside>
  </div>
</main>

<script>
let es = null, taskId = null;
const urlInput = document.getElementById("url");
const HDU_COLLEGE_ID = "1940953111032012801";
const savedIdentity = loadSavedIdentity();
fillParams(savedIdentity);

function loadSavedIdentity(){
  try {
    return JSON.parse(localStorage.getItem("xyIdentity") || "{}");
  } catch(error){
    localStorage.removeItem("xyIdentity");
    return {};
  }
}

urlInput.addEventListener("paste", () => {
  window.setTimeout(() => {
    if(!document.getElementById("startBtn").disabled) start(true);
  }, 0);
});

function showNotice(message, type = "error"){
  const el = document.getElementById("notice");
  el.textContent = message;
  el.className = "notice show" + (type === "ok" ? " ok" : "");
}

function clearNotice(){
  const el = document.getElementById("notice");
  el.textContent = "";
  el.className = "notice";
}

function clearCertificate(){
  document.getElementById("certificateResult").className = "certificate-result";
  const image = document.getElementById("certificateImage");
  image.hidden = true;
  image.removeAttribute("src");
  const save = document.getElementById("saveCertificate");
  save.hidden = true;
  save.href = "#";
  document.getElementById("openCertificate").href = "#";
  document.getElementById("openCertificate").hidden = true;
  document.getElementById("copyCertificate").dataset.url = "";
  document.getElementById("copyCertificate").hidden = true;
}

function clearException(){
  document.getElementById("exceptionResult").className = "exception-result";
  document.getElementById("exceptionTitle").textContent = "";
  document.getElementById("exceptionMessage").textContent = "";
}

function showException(outcome){
  const titles = {
    exhausted: "考试次数已用完",
    token_expired: "链接已失效",
    platform_error: "平台暂时不可用",
    chapter_incomplete: "章节尚未完成",
    exam_failed: "暂未获得证书",
  };
  document.getElementById("exceptionTitle").textContent = titles[outcome.type] || "任务未完成";
  document.getElementById("exceptionMessage").textContent = outcome.message || "请稍后再试。";
  document.getElementById("exceptionResult").className = "exception-result show";
}

function showCertificate(certificate){
  if(!certificate || (!certificate.url && !certificate.imageUrl)) return;
  if(certificate.imageUrl){
    const image = document.getElementById("certificateImage");
    image.src = certificate.imageUrl;
    image.hidden = false;
    const save = document.getElementById("saveCertificate");
    save.href = certificate.imageUrl;
    save.hidden = false;
  }
  if(certificate.url){
    document.getElementById("openCertificate").href = certificate.url;
    document.getElementById("openCertificate").hidden = false;
    document.getElementById("copyCertificate").dataset.url = certificate.url;
    document.getElementById("copyCertificate").hidden = false;
  }
  document.getElementById("certificateResult").className = "certificate-result show";
}

async function copyCertificateLink(){
  const url = document.getElementById("copyCertificate").dataset.url;
  if(!url) return;
  try {
    await navigator.clipboard.writeText(url);
    showNotice("证书链接已复制，可在浏览器中打开后保存。", "ok");
  } catch(error){
    showNotice("复制失败，请点击“打开证书”后从地址栏复制。", "error");
  }
}

function markCertificateSaved(){
  document.getElementById("saveCertificate").textContent = "本次证书已保存";
  showNotice("浏览器已开始保存证书图片。", "ok");
}

function setState(state, text){
  const el = document.getElementById("taskState");
  el.className = "task-state" + (state ? " " + state : "");
  document.getElementById("stateText").textContent = text;
}

function fillParams(params){
  if(params.userId) document.getElementById("userId").value = params.userId;
  document.getElementById("collegeId").value = HDU_COLLEGE_ID;
  if(params.ah) document.getElementById("ah").value = params.ah;
}

function rememberIdentity(params){
  if(!params.userId) return;
  localStorage.setItem("xyIdentity", JSON.stringify({userId: params.userId}));
}

function log(message, type = ""){
  const el = document.getElementById("log");
  const empty = el.querySelector(".empty");
  if(empty) el.textContent = "";
  const line = document.createElement("div");
  line.className = "log-line" + (type ? " log-" + type : "");
  line.textContent = message;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function start(fromPaste = false){
  const body = {
    url: urlInput.value.trim(),
    userId: document.getElementById("userId").value.trim(),
    collegeId: document.getElementById("collegeId").value.trim(),
    ah: document.getElementById("ah").value.trim(),
    mode: "certificate",
  };

  if(!body.url && (!body.ah || !body.userId || !body.collegeId)){
    showNotice("请粘贴完整链接，或手动填写三个参数。");
    return;
  }

  clearNotice();
  clearCertificate();
  clearException();
  setRunning(true);
  document.getElementById("log").textContent = "";
  setState("running", "运行中");
  log(fromPaste ? "已读取链接，开始一键答题" : "开始一键答题", "info");

  try {
    const response = await fetch("/api/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    const data = await response.json();
    if(data.error){
      if(data.params) fillParams(data.params);
      showNotice(data.error);
      showException({type: "platform_error", message: data.error});
      setState("failed", "未启动");
      setRunning(false);
      return;
    }

    taskId = data.taskId;
    if(data.params){
      fillParams(data.params);
      rememberIdentity(data.params);
    }
    connectStream(taskId);
  } catch(error){
    showNotice("启动失败：" + error.message);
    setState("failed", "错误");
    setRunning(false);
  }
}

function connectStream(id){
  es = new EventSource("/api/stream/" + id);
  es.onmessage = event => {
    const message = event.data;
    let type = "";
    if(message.includes("✓") || (message.includes("通过") && !message.includes("未通过"))) type = "pass";
    else if(message.includes("×") || message.includes("未通过") || message.includes("失败")) type = "fail";
    else if(message.includes("[!]") || message.includes("[错误]") || message.includes("警告")) type = "warn";
    log(message, type);
  };

  es.addEventListener("certificate", event => {
    try {
      showCertificate(JSON.parse(event.data));
    } catch(error){
      log("证书链接读取失败", "warn");
    }
  });

  es.addEventListener("outcome", event => {
    try {
      showException(JSON.parse(event.data));
    } catch(error){
      log("任务结果读取失败", "warn");
    }
  });

  es.addEventListener("done", event => {
    const status = event.data;
    if(status === "done"){
      log("任务完成", "pass");
      setState("done", "完成");
    } else if(status === "stopped"){
      log("任务已停止", "warn");
      setState("failed", "已停止");
    } else {
      log("任务未完全成功", "fail");
      setState("failed", "未完成");
    }
    es.close();
    es = null;
    setRunning(false);
  });

  es.onerror = () => {
    if(es){ es.close(); es = null; }
    log("进度连接中断", "warn");
    setState("failed", "连接中断");
    setRunning(false);
  };
}

function setRunning(running){
  document.getElementById("startBtn").disabled = running;
  document.getElementById("stopBtn").disabled = !running;
  if(!running) taskId = null;
}

async function stop(){
  if(!taskId) return;
  document.getElementById("stopBtn").disabled = true;
  try {
    await fetch("/api/stop/" + taskId, {method: "POST"});
    log("已发送停止请求，等待当前网络请求结束", "warn");
    setState("running", "停止中");
  } catch(error){
    showNotice("停止失败：" + error.message);
    document.getElementById("stopBtn").disabled = false;
  }
}

</script>
</body>
</html>
